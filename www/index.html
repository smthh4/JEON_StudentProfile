<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale-1.0" />
    <title>JEON Student Profile - Profile </title>

    <style>
        body {
            margin: 0;
            background: #171044;
            color: white;
            font-family: arial;
        }

        header {
            background: linear-gradient(135deg, #24145f, #38218a);
            text-align: center;
            padding: 40px 20px 30px;

        }

        body img {
            width: 200px;
            height: 200px;
            object-fit: cover; 
            border-radius: 50%;
        }

        h1 {
            margin: 20px 0 5px;
            font-size: 45px;
        }

        header h2 {
            margin-top: 5px;
            color: #c4b5fd;
            font-weight: normal;
            font-size: 30px;
        }

        nav {
            margin-top: 25px;
        }

        nav a {
            color: white;
            background: #4c2aa8;
            padding: 10px 25px;
            margin: 5px;
            border-radius: 25px;
            text-decoration: none;
        }

        .sections {
            display: flex;
            justify-content: center;
            max-width: 1500px;
            margin: 30px auto;
            gap: 50px;
            display: grid;
        }

        .introduction{
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: #21175a;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .introduction p {
            line-height: 1.5;
            color: #e5e1ff;
            font-size: 17px;
            text-align: justify;
        }

        section h2 {
            color: #c4b5fd;
            font-size: 30px;
        }

        footer {
            text-align: center;
            background: #0f0b2e;
            padding: 25px;
            margin-top: 60px;
            color: #aaa4c7;
            min-height: 5vh;
            display: flex;
            flex-direction: column;
        }


        @media (max-width: 390px) {
            
            .sections {
                gap: 50px;
                display: grid;
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 1024px) {
            
            .sections {
                gap: 50px;
                display: grid;
                grid-template-columns: 1fr;
            }
        }

        .hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: Arial;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
        }

    </style>
</head>

<body>
    <header>
        <div class="stacks">
            <nav>
                <a href="index.html">Profile</a>
                <a href="JEON_cordovaStudentProfileAbout.html">About</a>
                <a href="JEON_cordovaStudentProfileSkills.html">Skills</a>
                <a href="JEON_cordovaStudentProfileProjects.html">Projects</a>    
                <a href="JEON_cordovaStudentProfileContact.html">Contact</a>
            </nav>
        </div>
    </header>

<div class="sections">

    <section class="introduction" id="profileView">
        <img src="profil.jpg" alt="Profile Picture" style="display: block; margin: 0 auto;">
        <h1 style="text-align: center;">Student Profile</h1>
        <h2 style="text-align: center;">Introduction</h2>
        <hr color="#c4b5fd">

        <p><strong>Name:</strong> <span id="displayName"></span></p>
        <p><strong>About:</strong> <span id="displayAbout"></span></p>
        <p><strong>Course:</strong> <span id="displayCourse"></span></p>
        <p><strong>Year Level:</strong> <span id="displayYear"></span></p>
        <p><strong>Skills:</strong> <span id="displaySkills"></span></p>
        <button id="editProfileButton">Edit Profile</button>
    </section>

    <section class="introduction hidden" id="editProfileSection">

        <h2>Edit Profile</h2>

        <form id="profileForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName">
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <input type="text" id="course">
            </div>

            <div class="form-group">
                <label for="yearLevel">Year Level</label>
                <input type="text" id="yearLevel">
            </div>

            <div class="form-group">
                <label for="about">About Me</label>
                <textarea id="about" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="skills">Skills</label>
                <textarea id="skills" rows="4"></textarea>
            </div>

            <p id="formMessage"></p>

            <div class="form-buttons">
                <button type="submit">Save</button>
                <button type="button" id="cancelButton">Cancel</button>
            </div>

        </form>

    </section>

</div>

    <footer>
        <p>&copy; 2026 Jeon Min Soo</p>
        <p>ITCC 41 - Mobile Application Development</p>
    </footer>

    <script src="profileJS.js"></script>

</body>

</html>
