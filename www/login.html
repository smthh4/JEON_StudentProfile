        <!DOCTYPE html>
        <html lang="en">

        <style>
            body {
                margin: 0;
                background: #171044;
                color:white;
                font-family: Arial, Helvetica;
                min-height: 100vh;
            }

            body h1 {
                text-align: center;
            }

            .login-box { width: 100%; 
                max-width: 420px; 
                background: #21175a; 
                padding: 35px; 
                border-radius: 20px; 
                box-sizing: border-box; 
                border: 1px solid #38218a; 
            } 
            
            .login-box h2 { 
                text-align: center; 
                margin-top: 0; 
                margin-bottom: 8px; 
                color: #c4b5fd; 
                font-size: 26px; 
            } 

            .login-box .subtitle { 
                text-align: center; 
                color: #d9d0ff; 
                margin-bottom: 30px; 
                font-size: 14px; 
            } 
                
            .input-group { 
                margin-bottom: 20px; 
            } 
            
            .input-group label { 
                display: block; 
                margin-bottom: 8px; 
                color: #ffffff; 
                font-size: 14px; 
            } 
            
            .input-group input { 
                width: 100%; 
                padding: 13px; 
                box-sizing: border-box; 
                border: 1px solid #4c2aa8; 
                border-radius: 8px; 
                background: #171044; 
                color: white; 
                font-size: 15px; 
                outline: none; 
            } 
            
            .input-group input::placeholder { 
                color: #aaa2c9; 
            } 
            
            .input-group input:focus { 
                border-color: #8b6cff; 
                 } 
                 
            #loginButton { 
                width: 100%; 
                padding: 13px; 
                border: none; 
                border-radius: 25px; 
                background: #4c2aa8; 
                color: white; 
                font-size: 16px; 
                font-weight: bold; 
                cursor: pointer; 
                transition: 0.2s; 
            }

            @media (max-width: 390px) { 
            
            body h1 { 
                font-size: 23px; 
                   } 
            
            .container { 
                padding: 15px; 
            } 
            
            .login-box { 
                padding: 25px 20px; 
            } 
            
            .login-box h2 { 
                font-size: 23px; 
            } 
        }

        </style>

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Login Page</title>
        </head>
        <body>
            <div class="container" id="login">
                <h1 >Log In</h1>
                <form id="loginForm">
                    <div class="input-group">
                        <input type="StudentId" name="StudentId" id="StudentID" placeholder="StudentID / Email" required>
                        <label for="StudentID"></label>
                    </div>
                    <div class="input-group">
                        <input type="Password" name="Password" id="Password" placeholder="Password" required>
                        <label for="Password"></label>
                    </div>
                    <div>
                        <button type="submit" id="loginButton" value="Login" name="Login"> Log In </button>
                        <p id="loginMessage"></p>
                    </div>
                </form>
            </div>
                <script src="login.js"></script>

        </body>  
        </html>
